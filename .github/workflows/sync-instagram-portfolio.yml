name: Sync Instagram portfolio

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write

concurrency:
  group: instagram-portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Refresh the fixed, verified creator selection
        env:
          INSTAGRAM_PAGE_TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_GRAPH_VERSION: ${{ vars.INSTAGRAM_GRAPH_VERSION }}
        run: node scripts/sync-creator.mjs

      - name: Commit only validated portfolio changes
        run: |
          git add assets/creator/snapshot.json
          if git diff --cached --quiet; then
            echo "Instagram portfolio is already current."
            exit 0
          fi
          git config user.name "ugc-portfolio-sync[bot]"
          git config user.email "ugc-portfolio-sync[bot]@users.noreply.github.com"
          git commit -m "chore: refresh verified creator measurements [skip-vercel]"
          git push
