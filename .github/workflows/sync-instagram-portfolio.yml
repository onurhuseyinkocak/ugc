name: Sync Instagram portfolio

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write

concurrency:
  group: instagram-portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Refresh the fixed, verified creator selection
        env:
          INSTAGRAM_PAGE_TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          INSTAGRAM_GRAPH_BASE: ${{ vars.INSTAGRAM_GRAPH_BASE }}
          INSTAGRAM_PEAK_IDS: ${{ vars.INSTAGRAM_PEAK_IDS }}
        run: node scripts/sync-creator.mjs

      - name: Rebuild the pages and discovery files from the new snapshot
        run: node scripts/build-creator.mjs && node --test scripts/test-creator.mjs

      - name: Check the exact output that will be published
        run: node scripts/prepare-site.mjs && node scripts/verify-public.mjs

      - name: Commit only validated portfolio changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Instagram portfolio is already current."
            exit 0
          fi
          git config user.name "ugc-portfolio-sync[bot]"
          git config user.email "ugc-portfolio-sync[bot]@users.noreply.github.com"
          git commit -m "chore: refresh verified creator measurements"
          git push
